# Integração contínua: a cada push e pull request, confere formatação, lint,
# compilação e testes (sem Docker: as fontes são testadas contra servidores
# MQTT, Modbus e OPC UA em memória), e se as imagens Docker compilam.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t talos:ci .
      - run: docker build --target simulators -t talos-simulators:ci .
