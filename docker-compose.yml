services:
  timescaledb:
    # Versão fixa: builds reproduzíveis (a mesma usada nos testes).
    image: timescale/timescaledb:2.27.1-pg16
    container_name: talos-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-scada}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scada}
      POSTGRES_DB: ${DB_NAME:-scada}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      # O schema é criado pelas migrations (src/database/migrations), aplicadas
      # na subida da API ou com `npm run migration:run`.
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-scada} -d ${DB_NAME:-scada}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker MQTT para a fonte MQTT (MQTT_ENABLED=true). Sem autenticação:
  # apenas para desenvolvimento/laboratório (ver docker/mosquitto/mosquitto.conf).
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: talos-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Opcional: cliente web para inspecionar o banco durante o desenvolvimento.
  # Suba com:  docker compose --profile tools up -d
  adminer:
    image: adminer:6.1.1
    container_name: talos-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles: ['tools']

  # A própria API em container (opcional). Suba com:
  #   docker compose --profile app up -d --build
  # Lê o .env, trocando o que muda dentro da rede do Docker (banco e broker).
  # Simuladores rodando no PC (npm run sim:modbus / sim:opcua) ficam em
  # host.docker.internal, ex: MODBUS_HOST=host.docker.internal.
  api:
    build: .
    image: talos:latest
    container_name: talos-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      PORT: 3000
      MQTT_URL: mqtt://mosquitto:1883
    ports:
      - '${PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - opcua_pki:/app/.opcua-pki
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    profiles: ['app']

volumes:
  timescale_data:
  opcua_pki:
