services:
  timescaledb:
    # Versão fixa: builds reproduzíveis (a mesma usada nos testes).
    image: timescale/timescaledb:2.27.1-pg16
    container_name: talos-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-scada}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scada}
      POSTGRES_DB: ${DB_NAME:-scada}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      # O schema é criado pelas migrations (src/database/migrations), aplicadas
      # na subida da API ou com `npm run migration:run`.
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-scada} -d ${DB_NAME:-scada}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker MQTT para a fonte MQTT (MQTT_ENABLED=true). Sem autenticação:
  # apenas para desenvolvimento/laboratório (ver docker/mosquitto/mosquitto.conf).
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: talos-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Opcional: cliente web para inspecionar o banco durante o desenvolvimento.
  # Suba com:  docker compose --profile tools up -d
  adminer:
    image: adminer:6.1.1
    container_name: talos-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles: ['tools']

volumes:
  timescale_data:
