services:
  timescaledb:
    # Versão fixa: builds reproduzíveis (a mesma usada nos testes).
    image: timescale/timescaledb:2.27.1-pg16
    container_name: talos-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-scada}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scada}
      POSTGRES_DB: ${DB_NAME:-scada}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      # O schema é criado pelas migrations (src/database/migrations), aplicadas
      # na subida da API ou com `npm run migration:run`.
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-scada} -d ${DB_NAME:-scada}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker MQTT para a fonte MQTT (MQTT_ENABLED=true). Sem autenticação:
  # apenas para desenvolvimento/laboratório (ver docker/mosquitto/mosquitto.conf).
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: talos-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Opcional: cliente web para inspecionar o banco durante o desenvolvimento.
  # Suba com:  docker compose --profile tools up -d
  adminer:
    image: adminer:6.1.1
    container_name: talos-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles: ['tools']

  # A própria API em container (opcional). Suba com:
  #   docker compose --profile app up -d --build
  # Lê o .env, trocando o que muda dentro da rede do Docker (banco e broker).
  # Simuladores rodando no PC (npm run sim:modbus / sim:opcua) ficam em
  # host.docker.internal, ex: MODBUS_HOST=host.docker.internal.
  api:
    build:
      context: .
      target: api
    image: talos:latest
    container_name: talos-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      PORT: 3000
      MQTT_URL: mqtt://mosquitto:1883
    ports:
      - '${PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - opcua_pki:/app/.opcua-pki
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    profiles: ['app']

  # Simuladores de equipamentos (opcionais), para testar as fontes sem hardware:
  #   docker compose --profile simulators up -d --build
  # No PC: Modbus TCP em localhost:5020 e OPC UA em opc.tcp://localhost:4840.
  # Da API em container: modbus-sim:5020 e opc.tcp://opcua-sim:4840. O
  # simulador MQTT publica no broker (talos/sim/001...); cadastre as tags.
  modbus-sim:
    build:
      context: .
      target: simulators
    image: talos-simulators:latest
    container_name: talos-modbus-sim
    restart: unless-stopped
    command: ['node', '-r', 'ts-node/register/transpile-only', 'tools/modbus-sim.ts']
    environment:
      MODBUS_SIM_HOST: 0.0.0.0
    ports:
      - '5020:5020'
    profiles: ['simulators']

  opcua-sim:
    build:
      context: .
      target: simulators
    image: talos-simulators:latest
    container_name: talos-opcua-sim
    restart: unless-stopped
    command: ['node', '-r', 'ts-node/register/transpile-only', 'tools/opcua-sim.ts']
    environment:
      # Certificado do servidor num volume: o mesmo a cada reinício, para não
      # precisar confiar nele de novo (OPCUA_TRUST_UNKNOWN_CERTS=false).
      OPCUA_SIM_PKI_DIR: /pki
    ports:
      - '4840:4840'
    volumes:
      - opcua_sim_pki:/pki
    profiles: ['simulators']

  mqtt-sim:
    build:
      context: .
      target: simulators
    image: talos-simulators:latest
    container_name: talos-mqtt-sim
    restart: unless-stopped
    command: ['node', '-r', 'ts-node/register/transpile-only', 'tools/mqtt-sim.ts']
    environment:
      MQTT_SIM_URL: mqtt://mosquitto:1883
    depends_on:
      mosquitto:
        condition: service_started
    profiles: ['simulators']

volumes:
  timescale_data:
  opcua_pki:
  opcua_sim_pki:
